name: Deploy presentations to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Publish the static index page and presentation folders as-is.
      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r presentations _site/
          find _site \( -name 'README.md' -o -name '.gitignore' \) -delete
          # Internal-only decks are kept in the repo but not published.
          rm -f _site/presentations/Pres-GHCP_champions_brownfield_primitives_iterations/ghcp_champions_internal.html

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
