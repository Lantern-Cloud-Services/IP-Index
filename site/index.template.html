<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lantern Cloud Services &mdash; Presentations</title>
  <style>
    :root {
      --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3;
      --muted: #8b949e; --accent: #58a6ff; --accent-2: #a371f7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 20% 0%, #1f2a44 0%, var(--bg) 55%);
    }
    header { max-width: 1200px; margin: 0 auto; padding: 64px 24px 24px; }
    header h1 {
      margin: 0 0 8px; font-size: clamp(2rem, 4vw, 3rem);
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    header p { margin: 0; color: var(--muted); }
    .toolbar { margin-top: 24px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    #search {
      flex: 1 1 280px; max-width: 420px; padding: 10px 14px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 1rem;
    }
    .count { color: var(--muted); font-size: .9rem; }
    main {
      max-width: 1200px; margin: 0 auto; padding: 16px 24px 64px;
      display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    }
    .tile {
      display: flex; flex-direction: column; background: var(--panel);
      border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    }
    .tile[hidden] { display: none; }
    .tile:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 8px 24px rgba(0,0,0,.35); }
    .tile-main { flex: 1; display: flex; flex-direction: column; padding: 22px; color: inherit; text-decoration: none; }
    .meta { margin: 0 0 8px; color: var(--muted); font-size: .85rem; }
    .tile h2 { margin: 0 0 10px; font-size: 1.3rem; }
    .desc { margin: 0 0 16px; color: #c9d1d9; line-height: 1.5; flex: 1; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .tag { font-size: .75rem; padding: 3px 9px; border-radius: 999px; background: rgba(88,166,255,.12); color: var(--accent); }
    .cta { color: var(--accent); font-weight: 600; }
    .links { display: flex; flex-wrap: wrap; gap: 14px; padding: 12px 22px; border-top: 1px solid var(--border); }
    .secondary { color: var(--muted); font-size: .9rem; text-decoration: none; }
    .secondary:hover { color: var(--accent); }
    .empty { color: var(--muted); }
    footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 0 24px 32px; }
  </style>
</head>
<body>
  <header>
    <h1>Presentations</h1>
    <p>Customer deliveries and live presentation content from Lantern Cloud Services.</p>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Filter presentations&hellip;" aria-label="Filter presentations" />
      <span class="count" id="count">{{COUNT}} presentation(s)</span>
    </div>
  </header>
  <main id="tiles">{{TILES}}
  </main>
  <footer>Lantern Cloud Services</footer>
  <script>
    const search = document.getElementById("search");
    const tiles = [...document.querySelectorAll(".tile")];
    const count = document.getElementById("count");
    search.addEventListener("input", () => {
      const q = search.value.trim().toLowerCase();
      let shown = 0;
      tiles.forEach(t => {
        const match = !q || t.dataset.search.includes(q);
        t.hidden = !match;
        if (match) shown++;
      });
      count.textContent = `${shown} presentation(s)`;
    });
  </script>
</body>
</html>
